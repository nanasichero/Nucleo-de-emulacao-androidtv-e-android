android {
    namespace 'com.nanaarch.emulador'
    compileSdk 34

    defaultConfig {
        applicationId "com.nanaarch.emulador"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Gera pacotes otimizados ou suporte universal para as 4 arquiteturas Android
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}
